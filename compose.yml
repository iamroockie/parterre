services:
  api:
    build: .
    env_file: .env
    environment:
      POSTGRES_DSN: "postgres://parterre:parterre@postgres:5432/parterre?sslmode=disable"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
      start_interval: 200ms

  postgres:
    image: postgres:18.4-trixie
    environment:
      POSTGRES_DB: parterre
      POSTGRES_USER: parterre
      POSTGRES_PASSWORD: parterre
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parterre -d parterre -h 127.0.0.1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
      start_interval: 200ms

volumes:
  postgres_data:
