services:
  postgres:
    image: postgres:18.4-trixie
    environment:
      POSTGRES_DB: parterre
      POSTGRES_USER: parterre
      POSTGRES_PASSWORD: parterre
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parterre -d parterre -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
