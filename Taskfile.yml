version: 3

vars:
  GOLANGCI_LINT_VERSION: "2.13.1"

  PROJECT_NAME: parterre
  BIN_DIR: "{{.ROOT_DIR}}/bin"
  COVERAGE_FILE: "{{.ROOT_DIR}}/coverage.out"
  GOLANGCI_LINT: "{{.BIN_DIR}}/golangci-lint"

dotenv:
  - .env

env:
  GOOSE_DRIVER: postgres
  GOOSE_DBSTRING: "{{.POSTGRES_DSN}}"
  GOOSE_MIGRATION_DIR: "{{.ROOT_DIR}}/internal/platform/pg/migrations/sql"

tasks:
  run:
    desc: "Запуск приложения"
    cmd: go run ./cmd/api

  up:
    desc: "Запуск postgres и api в docker"
    cmd: docker compose up -d --wait --build

  up:db:
    desc: "Запуск только postgres"
    cmd: docker compose up -d --wait postgres

  down:
    desc: "Остановка инфраструктуры"
    cmd: docker compose down

  migrate:create:
    desc: "Создание SQL-миграции"
    preconditions:
      - sh: '[ -n "{{.CLI_ARGS}}" ]'
        msg: "Укажите имя: task migrate:create -- migration_name"
    cmd: 'go tool goose -s create "{{.CLI_ARGS}}" sql'

  migrate:up:
    desc: "Запуск SQL-миграции"
    cmd: "go tool goose up"

  migrate:down:
    desc: "Откат последней SQL-миграции"
    cmd: "go tool goose down"

  migrate:status:
    desc: "Статус SQL-миграций"
    cmd: "go tool goose status"

  migrate:validate:
    desc: "Валидация SQL-миграций"
    cmd: "go tool goose validate"

  check:
    desc: "Линтинг и тесты (включая интеграционные)"
    cmds:
      - task: lint
      - task: test:all

  test:
    desc: "Тесты (без интеграционных)"
    cmd: go test -short -race ./...

  test:all:
    desc: "Все тесты, включая интеграционные"
    cmd: go test -race ./...

  coverage:func:
    desc: "Покрытие всех тестов с выводом в процентах"
    cmds:
      - task: coverage
      - go tool cover -func="{{.COVERAGE_FILE}}"

  coverage:html:
    desc: "Покрытие всех тестов с выводом в HTML"
    cmds:
      - task: coverage
      - go tool cover -html="{{.COVERAGE_FILE}}" -o coverage.html

  lint:
    desc: "Линтинг"
    deps: [golangci-lint:install]
    cmd: '"{{.GOLANGCI_LINT}}" run ./...'

  format:
    desc: "Форматирование кода"
    deps: [golangci-lint:install]
    cmd: '"{{.GOLANGCI_LINT}}" fmt'

  coverage:
    internal: true
    desc: "Покрытие всех тестов"
    cmd: >-
      go test -count=1 -coverprofile="{{.COVERAGE_FILE}}"
      -coverpkg=$(go list ./... | grep -v '/.*test$' | paste -sd,) ./...

  golangci-lint:install:
    internal: true
    cmd: >-
      curl -sSfL https://golangci-lint.run/install.sh |
        sh -s -- -b "{{.BIN_DIR}}" "v{{.GOLANGCI_LINT_VERSION}}"
    status:
      - '"{{.GOLANGCI_LINT}}" version | grep -q "version {{.GOLANGCI_LINT_VERSION}}"'
