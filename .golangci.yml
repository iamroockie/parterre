version: "2"

formatters:
  enable:
    - gci
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - blank
        - dot
        - localmodule
      custom-order: true

linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - canonicalheader
    - copyloopvar
    - embeddedstructfieldcheck
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - dupl
    - gochecknoglobals
    - gocognit
    - gocritic
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - noctx
    - revive
    - staticcheck
    - unused
  settings:
    embeddedstructfieldcheck:
      forbid-mutex: true
    gocognit:
      min-complexity: 15
    lll:
      tab-width: 4
      line-length: 100
    revive:
      enable-default-rules: true
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

output:
  formats:
    text:
      print-linter-name: true
      print-issued-lines: true
      colors: true
