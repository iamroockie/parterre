version: "2"

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/iamroockie/parterre

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - exhaustive
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - noctx
    - revive
    - staticcheck
    - unused
  settings:
    lll:
      tab-width: 4
      line-length: 100
    revive:
      enable-default-rules: true
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true

output:
  formats:
    text:
      print-linter-name: true
      print-issued-lines: true
      colors: true
