name: Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: 3.51.1

      - name: Run lint and tests (with integration)
        run: task check

      - name: Build image and start stack
        run: |
          cp .env.example .env
          task up

      - name: Check endpoints
        run: |
          curl -fsS -o /dev/null -w 'healthz %{http_code}\n' http://127.0.0.1:8080/healthz
          curl -fsS -o /dev/null -w 'readyz %{http_code}\n' http://127.0.0.1:8080/readyz

      - name: Container logs on failure
        if: failure()
        run: docker compose logs
